<style id="css">
/* Layout: one narrow column, a segmented red progress bar, sharp-edged black/white buttons, photos as white-framed prints under the message. */
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --fg: #0a0a0a;
  --muted: #595959;
  --line: #d4d4d4;
  --accent: #d90f23;
  --accent-fg: #ffffff;
  --print: #ffffff;
  --font-display: "Noto Sans Georgian", "Sylfaen", system-ui, sans-serif;
  --font-body: "Noto Serif Georgian", "Sylfaen", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0a0a; --surface: #141414; --fg: #f5f5f5; --muted: #a3a3a3;
    --line: #2e2e2e; --accent: #ff2b3e; --accent-fg: #0a0a0a; --print: #f5f5f5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0a0a; --surface: #141414; --fg: #f5f5f5; --muted: #a3a3a3;
  --line: #2e2e2e; --accent: #ff2b3e; --accent-fg: #0a0a0a; --print: #f5f5f5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 18px; line-height: 1.7; padding-inline: 16px; padding-block: 24px 56px; }
main { max-width: 36rem; margin-inline: auto; display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.top { display: flex; align-items: center; gap: 16px; }
.dots { display: flex; gap: 6px; flex: 1; }
.dots span { height: 5px; flex: 1; background: var(--line); transition: background .3s; }
.dots span.on { background: var(--accent); }
.link { font-family: var(--font-display); font-weight: 500; font-size: .9rem; color: var(--fg); background: none; border: 0; border-bottom: 2px solid var(--accent); padding: 2px 0; cursor: pointer; }
h1, h2 { font-family: var(--font-display); font-weight: 800; line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 9vw, 3.1rem); }
h2 { font-size: clamp(1.7rem, 7vw, 2.3rem); }
.slab { width: 56px; height: 8px; background: var(--accent); }
.label { font-family: var(--font-display); font-weight: 500; font-size: .9rem; color: var(--muted); margin: 0; }
p { margin: 0; }
.screen { display: flex; flex-direction: column; gap: 24px; animation: rise .35s ease both; }
@keyframes rise { from { transform: translateY(8px); opacity: .01; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; line-height: 1.5; text-align: left; color: var(--fg); background: var(--surface); border: 2px solid var(--fg); border-radius: 0; padding: 14px 16px; cursor: pointer; display: flex; gap: 14px; align-items: baseline; min-width: 0; transition: background .15s, color .15s, border-color .15s; }
.choice b { font-weight: 800; flex: none; width: 1.2em; color: var(--accent); }
.choice:hover, .choice[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.choice:hover b, .choice[aria-pressed="true"] b { color: var(--accent-fg); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.reply { min-height: 3.4em; color: var(--muted); font-style: italic; }
.btn { font-family: var(--font-display); font-weight: 800; font-size: 1rem; background: var(--fg); color: var(--bg); border: 2px solid var(--fg); border-radius: 0; padding: 13px 26px; cursor: pointer; align-self: flex-start; }
.btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: transparent; color: var(--fg); }
.btn:disabled { opacity: .35; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.paper { border-top: 8px solid var(--accent); background: var(--surface); padding: 28px 22px; min-width: 0; }
#shown { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 1.15rem; line-height: 1.85; }
.photos { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; padding-block: 8px; }
.ph { margin: 0; background: var(--print); padding: 8px; width: min(100%, 15rem); box-shadow: 0 6px 18px rgba(0,0,0,.28); }
.ph:nth-child(odd) { transform: rotate(-1.6deg); }
.ph:nth-child(even) { transform: rotate(1.3deg); }
.ph img { display: block; width: 100%; height: auto; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-family: var(--font-display); font-weight: 500; font-size: .92rem; color: var(--muted); }
.field input, .field textarea { font: inherit; font-size: 1.05rem; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 0; padding: 12px 14px; width: 100%; }
.field textarea { min-height: 14rem; resize: vertical; line-height: 1.7; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.thumbs { display: flex; flex-wrap: wrap; gap: 12px; }
.thumb { position: relative; width: 6.5rem; }
.thumb img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border: 2px solid var(--line); }
.thumb button { position: absolute; top: 4px; right: 4px; font-family: var(--font-display); font-size: .75rem; font-weight: 800; background: var(--fg); color: var(--bg); border: 0; padding: 4px 8px; cursor: pointer; }
.thumb button:hover { background: var(--accent); color: var(--accent-fg); }
.note { font-family: var(--font-display); font-size: .92rem; color: var(--muted); min-height: 1.4em; }
</style>

    ["ცოტათი.", "მაშინ მალე დასრულდება."],
    ["საკმაოდ.", "ეს ნორმალურია. არ ვჩქარობთ."],
    ["ძალიან.", "გასაგებია. არავინ გაგაჩქარებს."],
    ["თითქმის გამიარა.", "მადლობა, რომ მზად ხარ წაიკითხო."] ] },
  { q: "რა დაგეხმარებოდა ყველაზე მეტად?", label: "კითხვა 3 / 4", opts: [
    ["გულწრფელი ბოდიში.", "სწორედ ეს მოდის შემდეგ."],
    ["დრო და სივრცე.", "შეგიძლია გვერდი დახურო და როცა მოისურვებ, დაბრუნდე."],
    ["საჭმელი.", "რამე საკიშკაო უნდა გიკისროს."] ] },
  { q: "დიდი ყლე გაქვს?", label: "კითხვა 4 / 4", opts: [
    ["კი", "კი."],
    ["არა", "არა."],
    ["ძალიან დიდი", "ფეხია მესამე."],
    ["ძალიან ძალიან დიდი", "გასაგებია."] ] }
];

function setDots(n) { dots.forEach((d, k) => d.classList.toggle("on", k <= n)); }
let i = 0;

function intro() {
  setDots(-1);
  stage.innerHTML = `<div class="screen">
    <div class="slab"></div>
    <h1>სანამ წაიკითხავ, რამდენიმე კითხვა.</h1>
    <p>ერთ წუთზე ნაკლები დასჭირდება. უპასუხე გულწრფელად.</p>
    <button class="btn" id="go">დაწყება</button></div>`;
  document.getElementById("go").onclick = () => { i = 0; ask(); };
}

function ask() {
  const s = steps[i];
  setDots(i);
  stage.innerHTML = `<div class="screen">
    <p class="label">${s.label}</p>
    <h2>${s.q}</h2>
    <div class="choices">${s.opts.map((o, k) =>
      `<button class="choice" data-k="${k}" aria-pressed="false"><b>${LETTERS[k]}.</b><span>${o[0]}</span></button>`).join("")}</div>
    <p class="reply" id="reply" aria-live="polite"></p>
    <button class="btn" id="next" disabled>შემდეგი</button></div>`;
  const next = document.getElementById("next");
  stage.querySelectorAll(".choice").forEach(b => b.onclick = () => {
    stage.querySelectorAll(".choice").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    document.getElementById("reply").textContent = s.opts[b.dataset.k][1];
    next.disabled = false;
  });
  next.onclick = () => { i++; i < steps.length ? ask() : ready(); };
}

function ready() {
  setDots(4);
  stage.innerHTML = `<div class="screen">
    <p class="label">ბოლო ნაბიჯი</p>
    <h2>${state.name ? esc(state.name) + ", ეს" : "ეს"} შენთვისაა.</h2>
    <p>წაიკითხე, როცა მზად იქნები.</p>
    <button class="btn" id="open">შეტყობინების ნახვა</button></div>`;
  document.getElementById("open").onclick = final;
}

function final() {
  setDots(4);
  stage.innerHTML = `<div class="screen">
    <div class="paper"><div id="shown">${esc(state.message)}</div></div>
    ${state.photos.length ? `<div class="photos">${state.photos.map(src => `<figure class="ph"><img src="${src}" alt="ფოტო"></figure>`).join("")}</div>` : ""}
    <div class="row"><button class="btn ghost" id="again">თავიდან</button></div></div>`;
  document.getElementById("again").onclick = intro;
}

/* ---------- owner editor ---------- */
function fileToJpeg(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const s = Math.min(1, 1100 / Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", 0.8));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function buildDoc(st) {
  const json = JSON.stringify(st).replace(/</g, "\\u003c");
  const font = document.querySelector('link[rel="stylesheet"]').href;
  return '<!doctype html>\n<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + document.title + '</title><meta property="og:type" content="website"><meta property="og:title" content="კაპოს"><meta property="og:description" content="შენთვისაა."><meta property="og:image" content="preview.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="preview.jpg"><link rel="stylesheet" href="' + font + '"><style id="css">' + document.getElementById("css").textContent + '</style></head><body><div id="app"></div><script type="application/json" id="state">' + json + '</' + 'script><script id="code">' + document.getElementById("code").textContent + '</' + 'script></body></html>';
}

function editor() {
  setDots(-1);
  const d = { name: state.name, message: state.message, photos: state.photos.slice() };
  stage.innerHTML = `<div class="screen">
    <h2>შეტყობინების შეცვლა</h2>
    <div class="field"><label for="f-name">მეგობრის სახელი (არასავალდებულო)</label><input id="f-name" type="text"></div>
    <div class="field"><label for="f-msg">შენი ბოდიში</label><textarea id="f-msg"></textarea></div>
    <div class="field"><label>ფოტოები</label>
      <div class="thumbs" id="thumbs"></div>
      <input id="f-file" type="file" accept="image/*" multiple hidden>
      <div class="row"><button class="btn ghost" id="add">ფოტოს დამატება</button></div></div>
    <div class="row"><button class="btn" id="save">ფაილის ჩამოტვირთვა</button><button class="btn ghost" id="cancel">გაუქმება</button></div>
    <p class="note" id="status" aria-live="polite"></p></div>`;
  const nameEl = document.getElementById("f-name"), msgEl = document.getElementById("f-msg");
  const fileEl = document.getElementById("f-file"), status = document.getElementById("status");
  nameEl.value = d.name; msgEl.value = d.message;
  const drawThumbs = () => {
    document.getElementById("thumbs").innerHTML = d.photos.map((s, k) =>
      `<div class="thumb"><img src="${s}" alt="ფოტო ${k + 1}"><button data-k="${k}">წაშლა</button></div>`).join("");
    document.querySelectorAll(".thumb button").forEach(b => b.onclick = () => { d.photos.splice(+b.dataset.k, 1); drawThumbs(); });
  };
  drawThumbs();
  document.getElementById("add").onclick = () => fileEl.click();
  fileEl.onchange = async () => {
    status.textContent = "ფოტოები მუშავდება…";
    for (const f of fileEl.files) {
      if (d.photos.length >= 8) { status.textContent = "მაქსიმუმ 8 ფოტო."; break; }
      try { d.photos.push(await fileToJpeg(f)); status.textContent = ""; }
      catch (e) { status.textContent = "ეს ფაილი ვერ გაიხსნა."; }
    }
    fileEl.value = ""; drawThumbs();
  };
  document.getElementById("cancel").onclick = intro;
  document.getElementById("save").onclick = () => {
    const next = { name: nameEl.value.trim(), message: msgEl.value, photos: d.photos };
    const blob = new Blob([buildDoc(next)], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "index.html";
    document.body.appendChild(a); a.click(); a.remove();
    status.textContent = "ფაილი ჩამოიტვირთა: index.html";
  };
}

editBtn.onclick = editor;
if (location.hash === "#edit") editBtn.hidden = false;
intro();
</script>
